[package]
name = "minecraft-sojourner"
version = "1.8.0"
edition = "2021"

[lib]
name = "minecraft_sojourner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2"
flate2 = "1"
lru = "0.12"
png = "0.17"
tiff = "0.9"
notify-debouncer-mini = "0.4"
tokio = { version = "1", features = ["sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
