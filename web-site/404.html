<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Sojourner</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--paper:#efe7d3;--ink:#262e1c;--ink-dim:#454f38;--muted:#77705c;--line:rgba(38,46,28,.18);
  --pine:#33502c;--rust:#a3441d;--gold:#a97a1f;
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;
  background:var(--paper);
  color:var(--ink-dim);font-family:var(--sans);text-align:center;padding:2rem}
.block{width:4rem;height:4rem;border-radius:2px;image-rendering:pixelated;
  background-image:repeating-conic-gradient(var(--pine) 0 25%,var(--gold) 0 50%);background-size:16px 16px;
  border:1px solid var(--line);box-shadow:0 12px 28px -14px #26301f4d}
.mark{font-family:var(--serif);font-size:clamp(2.6rem,9vw,4rem);font-weight:700;letter-spacing:-.01em;color:var(--pine)}
.tag{font-family:var(--serif);font-style:italic;font-size:.9rem;font-weight:700;color:var(--rust)}
p{max-width:30em;color:var(--ink-dim);line-height:1.6}
.xz{font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
a{color:var(--rust);text-decoration:none;font-weight:700}
a:hover,a:focus-visible{text-decoration:underline}
</style>
</head>
<body>
  <div class="block" aria-hidden="true"></div>
  <h1 class="mark">404</h1>
  <div class="tag">chunk not generated</div>
  <div class="xz">X: ?????? &nbsp; Z: ??????</div>
  <p><a href="/">&rsaquo; back to the surface</a></p>
</body>
</html>
