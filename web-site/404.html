<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Sojourner</title>
<style>
:root{--amber:#ffaa00;--amber-dim:#6b4700;--white:#e8e8e0;--muted:#7a6a50;--bg:#010100;--mono:Consolas,'Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
  background:var(--bg);color:var(--white);font-family:var(--mono);text-align:center;padding:2rem}
.block{width:4rem;height:4rem;image-rendering:pixelated;background-image:
  repeating-conic-gradient(#050005 0 25%,#f800f8 0 50%);background-size:16px 16px;
  border:1px solid #000;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.mark{font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:.06em;text-shadow:0 0 26px rgba(255,170,0,.28)}
.tag{font-size:.72rem;letter-spacing:.22em;color:var(--amber-dim);text-transform:uppercase}
p{max-width:30em;color:#c9c4b4;line-height:1.6}
.xz{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
a{color:var(--amber);text-decoration:none;border-bottom:1px solid var(--amber-dim);padding-bottom:.1em}
a:hover,a:focus-visible{border-color:var(--amber)}
</style>
</head>
<body>
  <div class="block" aria-hidden="true"></div>
  <h1 class="mark">404</h1>
  <div class="tag">chunk not generated</div>
  <p>Whatever was supposed to render at this address never got placed. Sojourner reads worlds off real disks — it can't invent one for a URL that doesn't exist.</p>
  <div class="xz">X: ??????&nbsp;&nbsp;Z: ??????</div>
  <p><a href="/">&rsaquo; back to the surface</a></p>
</body>
</html>
